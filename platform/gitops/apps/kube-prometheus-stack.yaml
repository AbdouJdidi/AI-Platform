# METRICS: Prometheus (collects numbers) + Grafana (dashboards) + Alertmanager (alerts).
# Installed from the official Helm chart, but deployed by Argo CD (GitOps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.9.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # kind runs these control-plane parts on 127.0.0.1 only, so Prometheus
        # can't reach them and would show false "target down" alerts.
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeEtcd: { enabled: false }
        kubeProxy: { enabled: false }

        prometheus:
          prometheusSpec:
            retention: 2d
            retentionSize: 3GB
            # Watch ServiceMonitors/rules from ANY app, not only this chart's.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 1Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts: ["grafana.localhost"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          # Add Loki so Grafana can show logs next to metrics.
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100

        prometheusOperator:
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }

        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }

        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart's CRDs are too big for normal "kubectl apply".
      - ServerSideApply=true
