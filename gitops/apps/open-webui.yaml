# Open WebUI = chat interface for the LLM served by Ollama on the host.
# Manifests live in apps/open-webui/ (Terraform owns platform/, Argo CD owns apps/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdouJdidi/AI-Platform.git
    targetRevision: main
    path: apps/open-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
