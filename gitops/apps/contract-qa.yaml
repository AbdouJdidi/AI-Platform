apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contract-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdouJdidi/AI-Platform.git
    targetRevision: main
    path: apps/contract-qa
  destination:
    server: https://kubernetes.default.svc
    namespace: contract-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
