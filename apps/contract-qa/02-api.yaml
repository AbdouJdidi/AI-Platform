# Contract QA API. Image is loaded into kind with `kind load docker-image`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-qa
spec:
  replicas: 1
  strategy:
    type: Recreate          # laptop: never run two copies of the models at once
  selector:
    matchLabels:
      app: contract-qa
  template:
    metadata:
      labels:
        app: contract-qa
    spec:
      containers:
        - name: api
          image: contract-qa:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: contract-qa-db
                  key: DATABASE_URL
            # Same Ollama-on-the-host setup that open-webui uses.
            - name: OLLAMA_HOST
              value: http://host.docker.internal:11434
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 2Gi
          startupProbe:         # torch + two models take a while to import
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: contract-qa
  labels:
    app: contract-qa
spec:
  selector:
    app: contract-qa
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-qa
spec:
  ingressClassName: traefik
  rules:
    - host: contract-qa.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contract-qa
                port:
                  number: 80
