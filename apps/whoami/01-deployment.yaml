# Deployment = "always keep N copies of this container running".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
  labels:
    app: whoami
spec:
  replicas: 3              # 2 copies (pods), spread over your 2 workers
  selector:
    matchLabels:
      app: whoami             # "the pods I manage are the ones labeled app=whoami"
  template:                   # the mold used to create each pod
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1   # tiny web server that prints request info
          ports:
            - name: http
              containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:     # "is it ready to receive traffic?"
            httpGet: { path: /, port: http }
          livenessProbe:      # "is it still alive? if not, restart it"
            httpGet: { path: /, port: http }
